<!doctype html><html><head><meta charset="utf-8"><title>Lumen — 02-onboarding</title><link rel="preconnect" href="https://fonts.googleapis.com"><link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700&display=swap" rel="stylesheet"><style>:root{--page:#fff;--surface:#fff;--surface2:rgb(237,241,241);--surface3:rgb(247,249,249);--line:rgb(220,227,227);--line2:rgb(185,199,198);--t1:rgb(9,15,13);--t2:rgb(47,70,68);--t3:rgb(98,126,124);--brand:rgb(0,55,255);--brand2:rgb(0,45,209);--brandSoft:rgb(229,235,255);--brand100:rgb(204,215,255);--ok:rgb(0,178,82);--okSoft:rgb(217,250,232);--warn:rgb(219,79,0);--warnSoft:rgb(251,237,229);--pink:rgb(255,83,222);--pinkSoft:rgb(255,238,252);--gold:rgb(241,174,64);--sh1:0 1px 2px rgba(9,15,13,.06);--sh2:0 8px 24px -8px rgba(9,15,13,.14);--sh3:0 18px 48px -12px rgba(9,15,13,.22);--skel:rgb(237,241,241);--skel2:rgb(247,249,249)}*{box-sizing:border-box}body{margin:0;background:#eef1f1;display:flex;align-items:flex-start;justify-content:center;padding:40px;font-family:Geist,-apple-system,sans-serif}</style></head><body><div class="screen" style="position: relative; width: 393px; height: 852px; overflow: hidden; background: var(--page); color: var(--t1); isolation: isolate; box-shadow: rgba(0,0,0,.35) 0 30px 80px -20px;"><div style="position: absolute; inset: 0px; background: var(--page); overflow: hidden;"><div style="position: absolute; inset: 0px; display: flex; flex-direction: column; background: var(--page);">
  <div style="height: 54px; flex: 0 0 auto;"></div>
  <div style="display: flex; align-items: center; justify-content: space-between; padding: 6px 24px 0px;">
    <div style="display: flex; align-items: center; gap: 8px;">
      <div style="width: 26px; height: 26px; border-radius: 9px; background: linear-gradient(rgb(0, 55, 255), rgb(0, 45, 209)); display: flex; align-items: center; justify-content: center;"><img src="icons/Stars.svg" style="display:inline-flex;width:15px;height:15px;flex:none"></div>
      <span style="font-size: 15px; font-weight: 600; letter-spacing: -0.3px; color: var(--t1);">Lumen</span>
    </div>
    <button style="border: 0px; background: transparent; padding: 6px 2px; font-family: inherit; font-size: 14px; line-height: 18px; font-weight: 500; color: var(--t3); cursor: pointer;">Skip</button>
  </div>
  <div style="position: relative; flex: 1 1 0%; margin: 18px 0px 0px; overflow: hidden;">
    <div style="position: absolute; inset: 0px; display: flex;">
      <div style="width: 393px; flex: 0 0 auto; display: flex; flex-direction: column; align-items: center; padding: 0px 24px;">
        <div style="position: relative; width: 100%; height: 340px; border-radius: 26px; overflow: hidden; background: var(--surface2); box-shadow: inset 0 0 0 1px var(--line);">
          <div style="position: absolute; inset: 0px; background-image: url(&quot;assets/course1.png&quot;); background-size: cover; background-position: center center;"></div>
          <div style="position: absolute; inset: 0px; background: linear-gradient(transparent 40%, rgba(9, 15, 13, 0.72));"></div>
          <div style="position: absolute; left: 16px; bottom: 16px; right: 16px; display: flex; align-items: center; gap: 10px; padding: 12px; border-radius: 16px; background: rgba(255, 255, 255, 0.14); backdrop-filter: blur(14px); box-shadow: rgba(255, 255, 255, 0.22) 0px 0px 0px 1px inset;">
            <div style="width: 34px; height: 34px; flex: 0 0 auto; border-radius: 12px; background: rgba(255, 255, 255, 0.92); display: flex; align-items: center; justify-content: center;"><img src="icons/Layers.svg" style="display:inline-flex;width:19px;height:19px;flex:none"></div>
            <div style="min-width: 0px;"><div style="font-size: 13px; line-height: 17px; font-weight: 600; color: rgb(255, 255, 255);">Adaptive path</div><div style="font-size: 11px; line-height: 15px; color: rgba(255, 255, 255, 0.72);">Rebuilt after every lesson</div></div>
          </div>
        </div>
        <div style="margin-top: 28px; font-size: 26px; line-height: 32px; font-weight: 700; letter-spacing: -0.9px; text-align: center; color: var(--t1);">A path, not a playlist</div>
        <div style="margin-top: 10px; font-size: 14px; line-height: 20px; color: var(--t3); text-align: center; max-width: 290px;">Lumen sequences what you learn next from what you just got wrong.</div>
      </div>
    </div>
  </div>
  <div style="flex: 0 0 auto; padding: 0px 24px 40px; display: flex; flex-direction: column; gap: 22px;">
    <div style="display: flex; align-items: center; justify-content: center; gap: 7px;">
      <div style="height: 6px; border-radius: 3px; width: 22px; background: var(--brand);"></div>
      <div style="height: 6px; border-radius: 3px; width: 6px; background: var(--line2);"></div>
      <div style="height: 6px; border-radius: 3px; width: 6px; background: var(--line2);"></div>
    </div>
    <button style="width: 100%; height: 52px; border: 0px; border-radius: 16px; background: linear-gradient(rgb(0, 55, 255), rgb(0, 45, 209)); box-shadow: rgb(0, 37, 173) 0px 0px 0px 1px, rgba(0, 27, 126, 0.72) 0px 12px 28px -8px; color: rgb(255, 255, 255); font-family: inherit; font-size: 15px; font-weight: 600; display: flex; align-items: center; justify-content: center; gap: 8px;">
      <span>Next</span><img src="icons/ArrowRight2.svg" style="display:inline-flex;width:19px;height:19px;flex:none">
    </button>
  </div></div></div><div style="position: absolute; top: 0px; left: 0px; right: 0px; height: 54px; z-index: 30; display: flex; align-items: center; justify-content: space-between; padding: 0px 30px;">
  <span style="font-size: 15px; font-weight: 600; color: var(--t1); letter-spacing: -0.2px;">9:41</span>
  <div style="display: flex; align-items: center; gap: 6px;">
    <div style="display: flex; align-items: flex-end; gap: 2px;"><div style="width: 3px; height: 5px; border-radius: 1px; background: var(--t1);"></div><div style="width: 3px; height: 7px; border-radius: 1px; background: var(--t1);"></div><div style="width: 3px; height: 9px; border-radius: 1px; background: var(--t1);"></div><div style="width: 3px; height: 11px; border-radius: 1px; background: var(--t1);"></div></div>
    <div style="width: 22px; height: 11px; border-radius: 3px; box-shadow: inset 0 0 0 1.2px var(--t1); padding: 1.6px; opacity: 0.9;"><div style="width: 70%; height: 100%; border-radius: 1.5px; background: var(--t1);"></div></div>
  </div></div><div style="position: absolute; top: 11px; left: 50%; transform: translateX(-50%); width: 118px; height: 33px; border-radius: 20px; background: rgb(5, 7, 6); z-index: 35;"></div><div style="position: absolute; bottom: 8px; left: 50%; transform: translateX(-50%); width: 134px; height: 5px; border-radius: 3px; background: var(--t3); z-index: 45;"></div></div></body></html>
