<!doctype html><html><head><meta charset="utf-8"><title>Lumen — 04-sign-up</title><link rel="preconnect" href="https://fonts.googleapis.com"><link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700&display=swap" rel="stylesheet"><style>:root{--page:#fff;--surface:#fff;--surface2:rgb(237,241,241);--surface3:rgb(247,249,249);--line:rgb(220,227,227);--line2:rgb(185,199,198);--t1:rgb(9,15,13);--t2:rgb(47,70,68);--t3:rgb(98,126,124);--brand:rgb(0,55,255);--brand2:rgb(0,45,209);--brandSoft:rgb(229,235,255);--brand100:rgb(204,215,255);--ok:rgb(0,178,82);--okSoft:rgb(217,250,232);--warn:rgb(219,79,0);--warnSoft:rgb(251,237,229);--pink:rgb(255,83,222);--pinkSoft:rgb(255,238,252);--gold:rgb(241,174,64);--sh1:0 1px 2px rgba(9,15,13,.06);--sh2:0 8px 24px -8px rgba(9,15,13,.14);--sh3:0 18px 48px -12px rgba(9,15,13,.22);--skel:rgb(237,241,241);--skel2:rgb(247,249,249)}*{box-sizing:border-box}body{margin:0;background:#eef1f1;display:flex;align-items:flex-start;justify-content:center;padding:40px;font-family:Geist,-apple-system,sans-serif}</style></head><body><div class="screen" style="position: relative; width: 393px; height: 852px; overflow: hidden; background: var(--page); color: var(--t1); isolation: isolate; box-shadow: rgba(0,0,0,.35) 0 30px 80px -20px;"><div style="position: absolute; inset: 0px; background: var(--page); overflow: hidden;"><div style="position: absolute; inset: 0px; overflow-y: auto; background: var(--page);">
  <div style="padding: 66px 24px 40px;">
    <button style="width: 38px; height: 38px; border: 0px; border-radius: 12px; background: var(--surface); box-shadow: inset 0 0 0 1px var(--line); display: flex; align-items: center; justify-content: center;"><img src="icons/ArrowLeft2.svg" style="display:inline-flex;width:19px;height:19px;flex:none"></button>
    <div style="margin-top: 22px; font-size: 28px; line-height: 34px; font-weight: 700; letter-spacing: -1px; color: var(--t1);">Create your account</div>
    <div style="margin-top: 8px; font-size: 14px; line-height: 20px; color: var(--t3);">Free for 14 days. No card, no lock-in.</div>
    <div style="margin-top: 28px; display: flex; flex-direction: column; gap: 15px;">
      <div style="display: flex; flex-direction: column; gap: 7px;">
        <label style="font-size: 12px; line-height: 16px; font-weight: 500; color: var(--t2);">Full name</label>
        <div style="display: flex; align-items: center; gap: 10px; height: 48px; padding: 0px 14px; border-radius: 12px; background: var(--surface); box-shadow: inset 0 0 0 1px var(--line);">
          <img src="icons/Profile.svg" style="display:inline-flex;width:19px;height:19px;flex:none">
          <input placeholder="Tahsan Rahman" style="flex: 1 1 0%; min-width: 0px; border: 0px; outline: 0px; background: transparent; font-family: inherit; font-size: 15px; color: var(--t1);">
        </div>
      </div>
      <div style="display: flex; flex-direction: column; gap: 7px;">
        <label style="font-size: 12px; line-height: 16px; font-weight: 500; color: var(--t2);">Work email</label>
        <div style="display: flex; align-items: center; gap: 10px; height: 48px; padding: 0px 14px; border-radius: 12px; background: var(--surface); box-shadow: inset 0 0 0 1px var(--line);">
          <img src="icons/Email.svg" style="display:inline-flex;width:19px;height:19px;flex:none">
          <input placeholder="you@studio.com" style="flex: 1 1 0%; min-width: 0px; border: 0px; outline: 0px; background: transparent; font-family: inherit; font-size: 15px; color: var(--t1);">
        </div>
      </div>
      <div style="display: flex; flex-direction: column; gap: 9px;">
        <label style="font-size: 12px; line-height: 16px; font-weight: 500; color: var(--t2);">Password</label>
        <div style="display: flex; align-items: center; gap: 10px; height: 48px; padding: 0px 14px; border-radius: 12px; background: var(--surface); box-shadow: inset 0 0 0 1px var(--line);">
          <img src="icons/Lock.svg" style="display:inline-flex;width:19px;height:19px;flex:none">
          <input placeholder="At least 8 characters" type="password" style="flex: 1 1 0%; min-width: 0px; border: 0px; outline: 0px; background: transparent; font-family: inherit; font-size: 15px; color: var(--t1);">
        </div>
        <div style="display: flex; align-items: center; gap: 6px;">
          <div style="flex: 1 1 0%; height: 4px; border-radius: 2px; background: var(--surface2);"></div>
          <div style="flex: 1 1 0%; height: 4px; border-radius: 2px; background: var(--surface2);"></div>
          <div style="flex: 1 1 0%; height: 4px; border-radius: 2px; background: var(--surface2);"></div>
          <div style="flex: 1 1 0%; height: 4px; border-radius: 2px; background: var(--surface2);"></div>
        </div>
        <div style="font-size: 12px; line-height: 16px; color: var(--t3);">Use 8+ characters with a number and a symbol.</div>
      </div>
      <div style="display: flex; align-items: flex-start; gap: 10px; margin-top: 2px;">
        <div style="width: 19px; height: 19px; flex: 0 0 auto; margin-top: 1px; border-radius: 6px; background: transparent; box-shadow: inset 0 0 0 1px var(--line2);"></div>
        <span style="font-size: 13px; line-height: 18px; color: var(--t2);">I agree to the Terms and the Privacy Policy.</span>
      </div>
    </div>
    <button style="margin-top: 24px; width: 100%; height: 52px; border: 0px; border-radius: 16px; font-family: inherit; font-size: 15px; font-weight: 600; display: flex; align-items: center; justify-content: center; gap: 8px; opacity: 0.55; background: linear-gradient(rgb(0, 55, 255), rgb(0, 45, 209)); box-shadow: rgb(0, 37, 173) 0px 0px 0px 1px, rgba(0, 27, 126, 0.72) 0px 12px 28px -8px; color: rgb(255, 255, 255);">
      <span>Create account</span><img src="icons/ArrowRight2.svg" style="display:inline-flex;width:19px;height:19px;flex:none">
    </button>
  </div></div></div><div style="position: absolute; top: 0px; left: 0px; right: 0px; height: 54px; z-index: 30; display: flex; align-items: center; justify-content: space-between; padding: 0px 30px;">
  <span style="font-size: 15px; font-weight: 600; color: var(--t1); letter-spacing: -0.2px;">9:41</span>
  <div style="display: flex; align-items: center; gap: 6px;">
    <div style="display: flex; align-items: flex-end; gap: 2px;"><div style="width: 3px; height: 5px; border-radius: 1px; background: var(--t1);"></div><div style="width: 3px; height: 7px; border-radius: 1px; background: var(--t1);"></div><div style="width: 3px; height: 9px; border-radius: 1px; background: var(--t1);"></div><div style="width: 3px; height: 11px; border-radius: 1px; background: var(--t1);"></div></div>
    <div style="width: 22px; height: 11px; border-radius: 3px; box-shadow: inset 0 0 0 1.2px var(--t1); padding: 1.6px; opacity: 0.9;"><div style="width: 70%; height: 100%; border-radius: 1.5px; background: var(--t1);"></div></div>
  </div></div><div style="position: absolute; top: 11px; left: 50%; transform: translateX(-50%); width: 118px; height: 33px; border-radius: 20px; background: rgb(5, 7, 6); z-index: 35;"></div><div style="position: absolute; bottom: 8px; left: 50%; transform: translateX(-50%); width: 134px; height: 5px; border-radius: 3px; background: var(--t3); z-index: 45;"></div></div></body></html>
