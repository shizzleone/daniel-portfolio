<!doctype html><html><head><meta charset="utf-8"><title>Lumen — 03-sign-in</title><link rel="preconnect" href="https://fonts.googleapis.com"><link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700&display=swap" rel="stylesheet"><style>:root{--page:#fff;--surface:#fff;--surface2:rgb(237,241,241);--surface3:rgb(247,249,249);--line:rgb(220,227,227);--line2:rgb(185,199,198);--t1:rgb(9,15,13);--t2:rgb(47,70,68);--t3:rgb(98,126,124);--brand:rgb(0,55,255);--brand2:rgb(0,45,209);--brandSoft:rgb(229,235,255);--brand100:rgb(204,215,255);--ok:rgb(0,178,82);--okSoft:rgb(217,250,232);--warn:rgb(219,79,0);--warnSoft:rgb(251,237,229);--pink:rgb(255,83,222);--pinkSoft:rgb(255,238,252);--gold:rgb(241,174,64);--sh1:0 1px 2px rgba(9,15,13,.06);--sh2:0 8px 24px -8px rgba(9,15,13,.14);--sh3:0 18px 48px -12px rgba(9,15,13,.22);--skel:rgb(237,241,241);--skel2:rgb(247,249,249)}*{box-sizing:border-box}body{margin:0;background:#eef1f1;display:flex;align-items:flex-start;justify-content:center;padding:40px;font-family:Geist,-apple-system,sans-serif}</style></head><body><div class="screen" style="position: relative; width: 393px; height: 852px; overflow: hidden; background: var(--page); color: var(--t1); isolation: isolate; box-shadow: rgba(0,0,0,.35) 0 30px 80px -20px;"><div style="position:absolute;inset:0;overflow-y:auto;background:var(--page);">
  <div style="padding: 74px 24px 40px;">
    <div style="width: 46px; height: 46px; border-radius: 15px; background: linear-gradient(rgb(0, 55, 255), rgb(0, 45, 209)); display: flex; align-items: center; justify-content: center; box-shadow: rgba(0, 27, 126, 0.6) 0px 12px 26px -8px;"><img src="icons/Stars.svg" style="display:inline-flex;width:24px;height:24px;flex:none"></div>
    <div style="margin-top: 24px; font-size: 28px; line-height: 34px; font-weight: 700; letter-spacing: -1px; color: var(--t1);">Welcome back</div>
    <div style="margin-top: 8px; font-size: 14px; line-height: 20px; color: var(--t3);">Pick up where you left off — lesson 7 of Design Systems at Scale.</div>
    <div style="margin-top: 30px; display: flex; flex-direction: column; gap: 16px;">
      <div style="display: flex; flex-direction: column; gap: 7px;">
        <label style="font-size: 12px; line-height: 16px; font-weight: 500; color: var(--t2);">Email</label>
        <div style="display: flex; align-items: center; gap: 10px; height: 48px; padding: 0px 14px; border-radius: 12px; background: var(--surface); box-shadow: inset 0 0 0 1px var(--line);">
          <img src="icons/Email.svg" style="display:inline-flex;width:19px;height:19px;flex:none">
          <input placeholder="you@studio.com" type="email" value="tahsan@studio.com" style="flex: 1 1 0%; min-width: 0px; border: 0px; outline: 0px; background: transparent; font-family: inherit; font-size: 15px; color: var(--t1);">
          <img src="icons/Checkmark.svg" style="display:inline-flex;width:18px;height:18px;flex:none">
        </div>
      </div>
      <div style="display: flex; flex-direction: column; gap: 7px;">
        <label style="font-size: 12px; line-height: 16px; font-weight: 500; color: var(--t2);">Password</label>
        <div style="display: flex; align-items: center; gap: 10px; height: 48px; padding: 0px 14px; border-radius: 12px; background: var(--surface); box-shadow: inset 0 0 0 1px var(--line);">
          <img src="icons/Lock.svg" style="display:inline-flex;width:19px;height:19px;flex:none">
          <input placeholder="••••••••" type="password" value="designsystems" style="flex: 1 1 0%; min-width: 0px; border: 0px; outline: 0px; background: transparent; font-family: inherit; font-size: 15px; color: var(--t1);">
          <div style="cursor: pointer; display: flex;"><img src="icons/Show.svg" style="display:inline-flex;width:19px;height:19px;flex:none"></div>
        </div>
      </div>
      <div style="display: flex; align-items: center; justify-content: space-between;">
        <div style="display: flex; align-items: center; gap: 9px; cursor: pointer;">
          <div style="width: 19px; height: 19px; border-radius: 6px; display: flex; align-items: center; justify-content: center; background: var(--brand); box-shadow: inset 0 0 0 1px var(--brand);">
            <img src="icons/Checkmark.svg" style="display:inline-flex;width:13px;height:13px;flex:none">
          </div>
          <span style="font-size: 13px; line-height: 17px; color: var(--t2);">Keep me signed in</span>
        </div>
        <a href="#" style="font-size: 13px; line-height: 17px; font-weight: 500;">Forgot?</a>
      </div>
    </div>
    <button style="margin-top: 26px; width: 100%; height: 52px; border: 0px; border-radius: 16px; background: linear-gradient(rgb(0, 55, 255), rgb(0, 45, 209)); box-shadow: rgb(0, 37, 173) 0px 0px 0px 1px, rgba(0, 27, 126, 0.72) 0px 12px 28px -8px; color: rgb(255, 255, 255); font-family: inherit; font-size: 15px; font-weight: 600; cursor: pointer; display: flex; align-items: center; justify-content: center; gap: 9px;">
      <span>Sign in</span>
    </button>
    <div style="margin-top: 24px; display: flex; align-items: center; gap: 12px;">
      <div style="flex: 1 1 0%; height: 1px; background: var(--line);"></div><span style="font-size: 12px; color: var(--t3);">or continue with</span><div style="flex: 1 1 0%; height: 1px; background: var(--line);"></div>
    </div>
    <div style="margin-top: 16px; display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 10px;">
      <button style="height: 48px; border: 0px; border-radius: 13px; background: var(--surface); box-shadow: inset 0 0 0 1px var(--line); display: flex; align-items: center; justify-content: center; cursor: pointer;">
        <img src="icons/Google.svg" style="display:inline-flex;width:21px;height:21px;flex:none">
      </button>
      <button style="height: 48px; border: 0px; border-radius: 13px; background: var(--surface); box-shadow: inset 0 0 0 1px var(--line); display: flex; align-items: center; justify-content: center; cursor: pointer;">
        <img src="icons/Facebook.svg" style="display:inline-flex;width:21px;height:21px;flex:none">
      </button>
      <button style="height: 48px; border: 0px; border-radius: 13px; background: var(--surface); box-shadow: inset 0 0 0 1px var(--line); display: flex; align-items: center; justify-content: center; cursor: pointer;">
        <img src="icons/Linkedin.svg" style="display:inline-flex;width:21px;height:21px;flex:none">
      </button>
    </div>
    <div style="margin-top: 28px; text-align: center; font-size: 13px; line-height: 18px; color: var(--t3);">New here? <a href="#" style="font-weight: 600;">Create an account</a></div>
  </div></div><div style="position: absolute; top: 0px; left: 0px; right: 0px; height: 54px; z-index: 30; display: flex; align-items: center; justify-content: space-between; padding: 0px 30px;">
  <span style="font-size: 15px; font-weight: 600; color: var(--t1); letter-spacing: -0.2px;">9:41</span>
  <div style="display: flex; align-items: center; gap: 6px;">
    <div style="display: flex; align-items: flex-end; gap: 2px;"><div style="width: 3px; height: 5px; border-radius: 1px; background: var(--t1);"></div><div style="width: 3px; height: 7px; border-radius: 1px; background: var(--t1);"></div><div style="width: 3px; height: 9px; border-radius: 1px; background: var(--t1);"></div><div style="width: 3px; height: 11px; border-radius: 1px; background: var(--t1);"></div></div>
    <div style="width: 22px; height: 11px; border-radius: 3px; box-shadow: inset 0 0 0 1.2px var(--t1); padding: 1.6px; opacity: 0.9;"><div style="width: 70%; height: 100%; border-radius: 1.5px; background: var(--t1);"></div></div>
  </div></div><div style="position: absolute; top: 11px; left: 50%; transform: translateX(-50%); width: 118px; height: 33px; border-radius: 20px; background: rgb(5, 7, 6); z-index: 35;"></div><div style="position: absolute; bottom: 8px; left: 50%; transform: translateX(-50%); width: 134px; height: 5px; border-radius: 3px; background: var(--t3); z-index: 45;"></div></div></body></html>
