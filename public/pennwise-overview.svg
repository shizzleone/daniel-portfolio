<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">Pennwise personal finance planning workspace</title>
  <desc id="desc">A calm personal finance dashboard with a lime accent, planning cards and a net worth chart.</desc>
  <rect width="1600" height="900" fill="#0a0a0a"/>
  <rect x="72" y="72" width="1456" height="756" rx="28" fill="#171717" stroke="#3f3f46" stroke-width="2"/>
  <text x="128" y="166" fill="#bef264" font-family="Arial, sans-serif" font-size="24" font-weight="700">PENNWlSE</text>
  <text x="128" y="236" fill="#fafafa" font-family="Arial, sans-serif" font-size="52" font-weight="700">Your financial compass</text>
  <text x="128" y="278" fill="#a3a3a3" font-family="Arial, sans-serif" font-size="22">See the plan. Understand the trade-offs. Move with confidence.</text>
