<!doctype html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Forge · Build and publish</title><style>
:root{--bg:#101314;--panel:#171c1d;--panel2:#202728;--text:#f4f7f5;--muted:#a8b1ae;--accent:#c7ff75;--line:#303a38;--canvas:#f3f6f4;--ink:#18201f}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font:14px Inter,system-ui,sans-serif}button,input,textarea,select{font:inherit}button{cursor:pointer;border:0}.app{min-height:100vh;display:flex;flex-direction:column}.top{height:68px;border-bottom:1px solid var(--line);display:flex;align-items:center;gap:22px;padding:0 22px}.brand{font-size:21px;font-weight:760;display:flex;align-items:center;gap:10px}.mark{width:27px;height:27px;border-radius:8px;background:var(--accent);display:grid;place-items:center;color:#111;font-weight:900}.top .grow{flex:1}.ghost{color:var(--muted);background:transparent;padding:10px 12px}.chip{background:var(--panel2);border:1px solid var(--line);color:var(--text);border-radius:9px;padding:9px 12px}.layout{display:grid;grid-template-columns:220px 1fr;flex:1}.side{border-right:1px solid var(--line);padding:24px 16px}.side small{color:var(--muted);letter-spacing:.12em;font-size:10px}.nav{display:grid;gap:7px;margin-top:18px}.nav button{background:transparent;color:#d9e1dd;text-align:left;padding:12px;border-radius:9px}.nav button:hover,.nav button.active{background:#28312f;color:var(--accent)}.new{width:100%;background:var(--accent);color:#101314;font-weight:760;padding:12px;border-radius:9px;margin:12px 0 20px}.main{padding:28px;overflow:auto}.view{max-width:1180px;margin:auto}.kicker{color:var(--accent);font-size:12px;letter-spacing:.14em;text-transform:uppercase}.h1{font-size:36px;letter-spacing:-.04em;margin:8px 0}.sub{color:var(--muted);max-width:630px;line-height:1.55}.builder{display:grid;grid-template-columns:1.1fr .9fr;gap:22px;margin-top:28px}.card{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:22px}.card h2{margin:0 0 15px;font-size:18px}.textarea{width:100%;height:150px;background:var(--panel2);border:1px solid #3c4845;color:var(--text);border-radius:10px;padding:15px;resize:vertical}.row{display:flex;gap:10px;margin-top:13px}.select{flex:1;background:var(--panel2);border:1px solid #3c4845;color:var(--text);border-radius:9px;padding:11px}.primary{background:var(--accent);color:#101314;font-weight:760;border-radius:9px;padding:12px 16px}.log{font:12px ui-monospace,monospace;color:#c7ff75;background:#111716;border-radius:10px;padding:14px;min-height:220px;line-height:1.8}.progress{height:7px;background:#303a38;border-radius:99px;margin:12px 0;overflow:hidden}.bar{height:100%;width:0;background:var(--accent);transition:width .5s}.workspace{display:grid;grid-template-columns:260px 1fr 280px;gap:12px;height:calc(100vh - 124px);min-height:600px}.pane{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:16px;overflow:auto}.pane h3{margin:0 0 14px}.bubble{background:var(--panel2);padding:12px;border-radius:10px;margin:10px 0;color:#dce5e1;line-height:1.45}.suggest{display:flex;flex-wrap:wrap;gap:6px;margin:12px 0}.suggest button{background:#293330;color:#c7ff75;border:1px solid #3d4a45;border-radius:99px;padding:7px 9px;font-size:12px}.compose{display:flex;gap:6px;margin-top:16px}.compose input{min-width:0;flex:1;background:var(--panel2);color:var(--text);border:1px solid #3c4845;border-radius:8px;padding:10px}.preview{background:var(--canvas);color:var(--ink);border-radius:10px;min-height:100%;padding:22px}.preview header{display:flex;justify-content:space-between;align-items:center}.preview h2{margin:10px 0}.metrics{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin:18px 0}.metric{background:white;border-radius:9px;padding:13px;box-shadow:0 2px 10px #10131410}.metric b{font-size:22px;display:block;margin-top:6px}.chart{height:170px;background:#fff;border-radius:9px;position:relative;overflow:hidden}.chart svg{width:100%;height:100%}.tabs{display:flex;gap:6px;margin-bottom:14px}.tabs button{background:transparent;color:var(--muted);padding:8px}.tabs button.sel{color:var(--accent);border-bottom:2px solid var(--accent)}.status{display:inline-flex;align-items:center;gap:6px;color:#8ef0bd;font-size:12px}.dot{width:7px;height:7px;border-radius:50%;background:#55dc98}.toast{position:fixed;right:24px;bottom:24px;background:#dfffb6;color:#101314;padding:13px 16px;border-radius:9px;font-weight:700;display:none}.modal{position:fixed;inset:0;background:#0009;display:none;place-items:center}.dialog{background:var(--panel);border:1px solid var(--line);border-radius:14px;width:min(520px,calc(100% - 32px));padding:24px}.dialog input{width:100%;background:var(--panel2);border:1px solid #3c4845;color:var(--text);padding:12px;border-radius:8px;margin:8px 0 16px}@media(max-width:900px){.layout{grid-template-columns:1fr}.side{display:none}.builder{grid-template-columns:1fr}.workspace{grid-template-columns:1fr;height:auto}.workspace .pane:nth-child(3){display:none}.main{padding:18px}.metrics{grid-template-columns:1fr 1fr}}
</style></head><body><div class="app"><header class="top"><div class="brand"><span class="mark">F</span>Forge</div><span class="muted">Build and publish internal apps</span><div class="grow"></div><button class="ghost" id="theme">◐ Theme</button><button class="chip">⌘K</button><button class="chip">Rob McAndrew ▾</button></header><div class="layout"><aside class="side"><button class="new" id="new">＋ New app</button><small>WORKSPACE</small><nav class="nav"><button class="active" data-view="build">✦ Build</button><button data-view="catalog">▦ App catalog</button><button data-view="governance">◇ Governance <b>2</b></button><button data-view="settings">⚙ Settings</button></nav></aside><main class="main"><div id="root"></div></main></div></div><div class="toast" id="toast"></div><div class="modal" id="modal"><div class="dialog"><h2>Publish app</h2><p class="sub">Review the app details before making it available to collaborators.</p><label>App name</label><input id="appname" value="Risk dashboard"><label>Visibility</label><select class="select"><option>Public to the organization</option><option>Private</option></select><div class="row"><button class="ghost" id="cancel">Cancel</button><button class="primary" id="confirm">Run governance review</button></div></div></div><script>
const root=document.getElementById('root'),toast=document.getElementById('toast');let state={view:'build',built:false,theme:localStorage.getItem('forge-theme')||'dark'};function showToast(t){toast.textContent=t;toast.style.display='block';setTimeout(()=>toast.style.display='none',2400)}function render(){if(state.view==='build'&&!state.built)return builder();if(state.view==='build'&&state.built)return workspace();root.innerHTML=`<div class="view"><span class="kicker">Forge / ${state.view}</span><h1>${state.view==='catalog'?'App catalog':state.view==='governance'?'Governance queue':'Settings'}</h1><p class="sub">${state.view==='catalog'?'Search and open the apps your team has created.':state.view==='governance'?'Review private apps waiting for metadata, policy, and ownership checks.':'Choose appearance, default model, and workspace preferences.'}</p><div class="card" style="margin-top:24px"><h2>${state.view==='catalog'?'Recent apps':'A focused control surface'}</h2><p class="sub">${state.view==='catalog'?'Risk dashboard · Live · 2 minutes ago\n\nQuarterly risk · Live · yesterday\n\nPricing page redesign · Live · 2 days ago':'The same shell keeps platform controls close without taking focus away from the active build.'}</p></div></div>`}function builder(){root.innerHTML=`<div class="view"><span class="kicker">New app · Step 1 of 2</span><h1 class="h1">What will you build today?</h1><p class="sub">Describe the outcome in plain language. Forge will create a working preview and show the evidence as it builds.</p><div class="builder"><section class="card"><h2>Describe your app</h2><textarea class="textarea" id="prompt">Build a risk dashboard with trends, open items, and approval states for operations.</textarea><div class="row"><select class="select"><option>Claude Agent (Auto)</option><option>GPT-5.1 Codex</option></select><select class="select"><option>React</option><option>Next.js</option><option>Static HTML</option></select></div><button class="primary" id="build" style="margin-top:14px;width:100%">Build app →</button></section><section class="card"><h2>What happens next</h2><div class="log" id="log">Your app has not been built yet.\n\nForge will show the source, framework, resolved dependencies, and preview as each stage completes.</div></section></div></div>`;document.getElementById('build').onclick=startBuild}function startBuild(){const log=document.getElementById('log'),btn=document.getElementById('build');btn.disabled=true;btn.textContent='Building…';let lines=['Agent is scaffolding your project…','Detected framework: React','Installing dependencies…','Resolved 428 packages in 6.1s','Running build…','Optimizing assets…','Uploading artifacts…','Published preview to risk-dashboard.forge.app'];let i=0;const tick=()=>{log.textContent+=`\n${lines[i]}`;i++;if(i<lines.length)setTimeout(tick,620);else{state.built=true;showToast('Build complete · preview is live');setTimeout(render,500)}};log.textContent='Build queued…';tick()}function workspace(){root.innerHTML=`<div class="view"><div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:14px"><div><span class="kicker">Workspace</span><h1 class="h1" style="font-size:28px">Risk dashboard</h1></div><div class="row" style="margin:0"><span class="status"><span class="dot"></span>Live</span><button class="primary" id="publish">Publish</button></div></div><div class="workspace"><section class="pane"><h3>Chat</h3><div class="bubble"><b>You</b><br>Build a risk dashboard with trends and approval states.</div><div class="bubble"><b>Forge</b><br>Your app is live. Review the preview, then ask for a change.</div><div class="suggest"><button>Make it responsive</button><button>Add a dark header</button><button>Show approval owners</button></div><div class="compose"><input id="change" placeholder="Ask for a change…"><button class="primary" id="send">↑</button></div></section><section class="pane"><div class="tabs"><button class="sel">Preview</button><button>Code</button></div><div class="preview"><header><b>Risk dashboard</b><span class="status"><span class="dot"></span>Live</span></header><h2>Good afternoon, Rob</h2><p style="color:#66716d">A quick view of the work that needs attention.</p><div class="metrics"><div class="metric">Open items<b>24</b></div><div class="metric">Approvals<b>08</b></div><div class="metric">Policy pass<b>100%</b></div></div><div class="chart"><svg viewBox="0 0 520 170" preserveAspectRatio="none"><path d="M0 138 C70 90 105 124 160 75 S260 122 320 55 S420 95 520 26" fill="none" stroke="#35a77c" stroke-width="5"/><path d="M0 138 C70 90 105 124 160 75 S260 122 320 55 S420 95 520 26 V170 H0Z" fill="#35a77c" opacity=".12"/></svg></div></div></section><section class="pane"><div class="tabs"><button class="sel">Details</button><button>Deploys</button><button>Logs</button></div><p class="sub">Status</p><p class="status"><span class="dot"></span>Live</p><p class="sub" style="margin-top:22px">Live URL</p><p>risk-dashboard.forge.app</p><p class="sub" style="margin-top:22px">Access</p><p>Rob McAndrew · Owner</p><p>Ava Patel · Editor</p><p>Sam Lee · Viewer</p></section></div></div>`;document.getElementById('publish').onclick=()=>document.getElementById('modal').style.display='grid';document.getElementById('send').onclick=()=>showToast('Change queued · rebuilding preview')}document.querySelectorAll('.nav button').forEach(b=>b.onclick=()=>{state.view=b.dataset.view;render()});document.getElementById('new').onclick=()=>{state.view='build';state.built=false;render()};document.getElementById('theme').onclick=()=>{state.theme=state.theme==='dark'?'light':'dark';document.body.style.setProperty('--bg',state.theme==='dark'?'#101314':'#eef2ef');document.body.style.setProperty('--panel',state.theme==='dark'?'#171c1d':'#fff');document.body.style.setProperty('--text',state.theme==='dark'?'#f4f7f5':'#18201f');localStorage.setItem('forge-theme',state.theme)};document.getElementById('cancel').onclick=()=>document.getElementById('modal').style.display='none';document.getElementById('confirm').onclick=()=>{document.getElementById('modal').style.display='none';showToast('Governance review passed · app published')};render();</script></body></html>
