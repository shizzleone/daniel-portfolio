  <text x="78" y="170" fill="#7d8290" font-family="Arial, sans-serif" font-size="14">PAYMENTS WORKSPACE</text>
  <text x="78" y="222" fill="#55c99c" font-family="Arial, sans-serif" font-size="17">Overview</text>
