<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720"><defs><linearGradient id="g" x2="1" y2="1"><stop stop-color="#101827"/><stop offset="1" stop-color="#203b4d"/></linearGradient></defs><rect width="1280" height="720" rx="24" fill="url(#g)"/><text x="58" y="70" fill="#f5f8fb" font-family="Arial" font-size="30" font-weight="700">Trustworthy enterprise foundations</text><text x="58" y="105" fill="#9db5c5" font-family="Arial" font-size="16">Status, density, and accessibility are designed as one system.</text><g font-family="Arial"><rect x="58" y="155" width="270" height="390" rx="16" fill="#f5f8fa"/><text x="88" y="200" fill="#506775" font-size="13">SEMANTIC COLOR</text><circle cx="105" cy="265" r="26" fill="#d57857"/><circle cx="175" cy="265" r="26" fill="#d19b4b"/><circle cx="245" cy="265" r="26" fill="#2d9b89"/><text x="88" y="350" fill="#203b4d" font-size="15" font-weight="700">Status carries meaning</text><text x="88" y="380" fill="#607784" font-size="13">never through color alone.</text><rect x="358" y="155" width="390" height="390" rx="16" fill="#152b3d"/><text x="390" y="200" fill="#9db8c6" font-size="13">DATA TYPOGRAPHY</text><text x="390" y="290" fill="#f5f8fb" font-size="48" font-weight="700">118.4%</text><text x="390" y="340" fill="#9db8c6" font-size="15">Metric title / 16</text><text x="390" y="375" fill="#6e8a99" font-size="13">Supporting context / 14</text><rect x="780" y="155" width="442" height="390" rx="16" fill="#f5f8fa"/><text x="812" y="200" fill="#506775" font-size="13">ACCESSIBILITY</text><text x="812" y="260" fill="#203b4d" font-size="18">✓ WCAG 2.1 AA contrast</text><text x="812" y="310" fill="#203b4d" font-size="18">✓ Keyboard-first workflows</text><text x="812" y="360" fill="#203b4d" font-size="18">✓ Non-color status cues</text><text x="812" y="410" fill="#203b4d" font-size="18">✓ Reduced-motion support</text></g></svg></svg>